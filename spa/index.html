    body { font-family: 'Inter', sans-serif; }
    
    .loader {

      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;

    @keyframes spin {

    /* --- ANIMASI TOAST POJOK (SIMPAN/ERROR) --- */
    @keyframes slideInRight {
      0% { transform: translateX(100%) scale(0.9); opacity: 0; }
      70% { transform: translateX(-5%) scale(1.02); opacity: 1; }
      100% { transform: translateX(0) scale(1); opacity: 1; }

    @keyframes slideOutRight {
      0% { transform: translateX(0) scale(1); opacity: 1; }
      100% { transform: translateX(120%) scale(0.9); opacity: 0; }
    }
    
    .toast-enter {
      animation: slideInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .toast-exit {
      animation: slideOutRight 0.4s ease-in forwards;
    }

    /* --- ANIMASI TOAST TENGAH (UPDATE) --- */
    @keyframes popInCenter {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }

    @keyframes fadeOutCenter {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    }

    .toast-center-enter {
      animation: popInCenter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .toast-center-exit {
      animation: fadeOutCenter 0.3s ease-in forwards;

    .disabled-input {

    }

    // --- UTILS TANGGAL LOKAL ---
    function getLocalDateYYYYMMDD() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000; 
      const localDate = new Date(now.getTime() - offset);
      return localDate.toISOString().split('T')[0];
    }

    function getFirstDayOfMonth() {
      const date = new Date();
      return new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];

    function saveSession(guruData, demoMode = false) {
        const sessionData = {
            guru: guruData,
            isDemo: demoMode,
            timestamp: new Date().getTime()

    }

    function checkSession() {
        try {
            const stored = localStorage.getItem(SESSION_KEY);

    // --- NOTIFICATION LOGIC ---
    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        showToast("Browser ini tidak mendukung notifikasi.", "error");
        return false;
      }

      const confirmMsg = "Mohon untuk menerima Notifikasi sebagai pengingat kehadiran harian.";
      if (!confirm(confirmMsg)) return false;

      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          showToast("Notifikasi diaktifkan!", "success");
          sendLocalNotification("Notifikasi Aktif", "Anda akan menerima pengingat kehadiran.");
          updateBellIcon();
          return true;
        } else {
          showToast("Izin notifikasi ditolak.", "error");
          return false;
        }
      } catch (e) {
        console.error("Permission request failed:", e);
        showToast("Gagal meminta izin notifikasi.", "error");
        return false;
      }
    }

    function sendLocalNotification(title, body) {
      if (Notification.permission === 'granted') {
        try {
          const notif = new Notification(title, {
            body: body,
            icon: 'https://cdn-icons-png.flaticon.com/512/3233/3233497.png', 
            vibrate: [200, 100, 200]
          });
          notif.onclick = function() { window.focus(); this.close(); };
        } catch (e) {
          console.warn("Native Notification blocked, falling back to UI.", e);
          showToast(`🔔 ${title}: ${body}`, "success");
        }
      }
    }

    function updateBellIcon() {
      const btn = document.getElementById('btnNotif');
      if (!btn) return;
      if (Notification.permission === 'granted') {
        btn.innerHTML = `<i class="ph ph-bell-ringing text-yellow-400 text-xl"></i>`;
        btn.classList.add('bg-yellow-400/10');
      } else {
        btn.innerHTML = `<i class="ph ph-bell-slash text-slate-400 text-xl"></i>`;
        btn.classList.remove('bg-yellow-400/10');
      }
    }

    async function checkDailyReminder() {
      if (Notification.permission !== 'granted') return;
      const today = getLocalDateYYYYMMDD();
      if(isDemoMode) return;

      const { count } = await supabase
        .from('kehadiran')
        .select('*', { count: 'exact', head: true })
        .eq('id_guru', currentGuru.id)
        .eq('tanggal', today);

      if (count === 0) {
        sendLocalNotification(
          "Pengingat Absensi", 
          `Halo ${currentGuru.nama}, jangan lupa input kehadiran siswa untuk hari ini (${today}).`
        );
      }
    }

    // --- UTILITIES: CUSTOM TOAST ---
    function showToast(message, type = 'success') {
      // 1. Toast Update (Tengah)
      if (type === 'success' && message.toLowerCase().includes('update')) {
        const toast = document.createElement('div');
        toast.className = `fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[100] bg-blue-600/90 backdrop-blur-md text-white px-10 py-8 rounded-3xl shadow-2xl flex flex-col items-center gap-4 toast-center-enter min-w-[260px] border border-white/20`;
        toast.innerHTML = `
          <div class="bg-white/20 p-4 rounded-full shadow-inner">
            <i class="ph ph-check text-5xl font-bold text-white drop-shadow-md"></i>
          </div>
          <div class="text-center">
            <h4 class="text-2xl font-bold tracking-tight">Berhasil Update!</h4>
            <p class="text-base text-blue-100 mt-1 font-medium">${message}</p>
          </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.classList.remove('toast-center-enter');
          toast.classList.add('toast-center-exit');
          setTimeout(() => toast.remove(), 300);
        }, 2000);
        return; 
      }

      // 2. Toast Biasa
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      let bgColor = 'bg-gray-800';
      let icon = 'ph-info';
      let title = 'Info';

      if (type === 'success') {
         bgColor = 'bg-emerald-600/95'; 
         icon = 'ph-check-circle';
         title = 'Berhasil Disimpan';
      } else {
         bgColor = 'bg-rose-600/95';
         icon = 'ph-warning-circle';
         title = 'Gagal';
      }

      toast.className = `${bgColor} text-white px-5 py-4 rounded-2xl shadow-xl flex items-center gap-4 toast-enter max-w-sm border border-white/10 backdrop-blur-sm`;
      toast.innerHTML = `
        <i class="ph ${icon} text-3xl shrink-0"></i>
        <div>
            <h5 class="font-bold text-sm leading-tight">${title}</h5>
            <p class="text-xs text-white/90 leading-tight mt-0.5">${message}</p>
        </div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => toast.remove(), 400); 
      }, 3000);
    }

    // --- LOGIKA VALIDASI TANGGAL ---
    async function loadConfigData() {
      if (isDemoMode) {
        schoolConfig = { hari_sekolah: 5 };
        return;
      }
      try {
        const { data: sekolahData } = await supabase.from('sekolah').select('hari_sekolah').limit(1).maybeSingle();
        if (sekolahData) schoolConfig.hari_sekolah = sekolahData.hari_sekolah || 5;
      } catch (err) {
        console.error("Gagal load config sekolah:", err);
      }
    }

    // Cek validitas tanggal (Async - Cek Database Kalender)
    async function validateDateAsync(dateStr) {
      const todayStr = getLocalDateYYYYMMDD();
      const localDateObj = new Date(dateStr);
      const dayIndex = localDateObj.getDay(); // 0=Minggu, 6=Sabtu

      // 1. Masa Depan
      if (dateStr > todayStr) {
          return { isValid: false, message: "❌ Tanggal Masa Depan (Belum dapat diisi)." };
      }

      // 2. Hari Libur Rutin (Weekend)
      if (dayIndex === 0) {
          return { isValid: false, message: "⛔ Hari Minggu (Libur)." };
      }
      if (schoolConfig.hari_sekolah === 5 && dayIndex === 6) {
          return { isValid: false, message: "⛔ Hari Sabtu (Sekolah 5 Hari Kerja)." };
      }

      // 3. Cek Kalender Pendidikan di Database
      if (!isDemoMode) {
          try {
              const { data: libur } = await supabase
                  .from('kalender_pendidikan')
                  .select('jenis, keterangan')
                  .eq('tanggal', dateStr)
                  .maybeSingle();

              if (libur) {
                  const label = libur.jenis.replace(/_/g, ' ');
                  return { isValid: false, message: `🏖️ ${label}: ${libur.keterangan || ''}` };
              }
          } catch (err) {
              console.error("Error check holiday", err);
          }
      }

      return { isValid: true, message: "" };
    }

    // --- EXPORT FUNCTIONS ---
    async function getExportDataRange() {
        if (isDemoMode) {
            return [
                { tanggal: exportStartDate, nama: 'Andi Saputra', nisn: '123', kelas: 'XA', status: 'HADIR' },
                { tanggal: exportStartDate, nama: 'Budi Santoso', nisn: '456', kelas: 'XA', status: 'SAKIT' },
                { tanggal: exportEndDate, nama: 'Andi Saputra', nisn: '123', kelas: 'XA', status: 'IZIN' },
                { tanggal: exportEndDate, nama: 'Budi Santoso', nisn: '456', kelas: 'XA', status: 'HADIR' },
            ];
        }

        // --- UPDATE: Filter by ID SISWA (Bukan ID Guru) ---
        // Ini memastikan histori terbaca walaupun siswa pindah wali
        if (!siswaBinaan || siswaBinaan.length === 0) {
             siswaBinaan = await fetchSiswaBinaan(); // Fallback fetch
        }
        const siswaIds = siswaBinaan.map(s => s.id);

        if(siswaIds.length === 0) return [];

        const { data, error } = await supabase
            .from('kehadiran')
            .select(`tanggal, status, siswa (nama, nisn, kelas (nama))`)
            .in('id_siswa', siswaIds) // Filter by Student ID
            .gte('tanggal', exportStartDate)
            .lte('tanggal', exportEndDate)
            .order('tanggal', { ascending: true })
            .order('siswa(nama)', { ascending: true });
            
        if (error) throw error;
        return data.map(row => ({
            tanggal: row.tanggal,
            nama: row.siswa?.nama || 'Unknown',
            nisn: row.siswa?.nisn || '-',
            // @ts-ignore
            kelas: row.siswa?.kelas?.nama || '-',
            status: row.status
        }));
    }

    async function exportToExcel() {
        const btn = document.getElementById('btnExportXls');
        const originalContent = btn.innerHTML;
        if(btn) btn.disabled = true;
        btn.innerHTML = `<div class="loader w-4 h-4"></div>`;
        try {
            const data = await getExportDataRange();
            if (data.length === 0) { showToast("Tidak ada data pada rentang tanggal ini", "error"); return; }
            const uniqueDates = [...new Set(data.map(item => item.tanggal))].sort();
            const studentMap = {};
            data.forEach(item => {
                const key = item.nisn && item.nisn !== '-' ? item.nisn : item.nama; 
                if (!studentMap[key]) {
                    studentMap[key] = { nama: item.nama, kelas: item.kelas, nisn: item.nisn, attendance: {} };
                }
                studentMap[key].attendance[item.tanggal] = item.status;
            });
            const headers = ["Nama Siswa", "Kelas", ...uniqueDates];
            const sheetData = [headers];
            Object.values(studentMap).sort((a, b) => a.nama.localeCompare(b.nama)).forEach(student => {
                const row = [
                    student.nama, student.kelas,
                    ...uniqueDates.map(date => student.attendance[date] || '-') 
                ];
                sheetData.push(row);
            });
            const worksheet = XLSX.utils.aoa_to_sheet(sheetData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Kehadiran");
            worksheet["!cols"] = [{ wch: 30 }, { wch: 15 }, ...uniqueDates.map(() => ({ wch: 12 }))];
            const fileName = `Rekap_Absensi_${currentGuru.nama}_${exportStartDate}_sd_${exportEndDate}.xlsx`;
            XLSX.writeFile(workbook, fileName);
            showToast("Excel berhasil diunduh!", "success");
        } catch (error) {
            console.error(error);
            showToast("Gagal export Excel: " + error.message, "error");
        } finally {
            if(btn) { btn.disabled = false; btn.innerHTML = originalContent; }
        }
    }

    async function exportToPDF() {
        const btn = document.getElementById('btnExportPdf');
        const originalContent = btn.innerHTML;
        if(btn) btn.disabled = true;
        btn.innerHTML = `<div class="loader w-4 h-4"></div>`;
        try {
            const data = await getExportDataRange();
            if (data.length === 0) { showToast("Tidak ada data pada rentang tanggal ini", "error"); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16); doc.text("LAPORAN REKAPITULASI KEHADIRAN", 14, 20);
            doc.setFontSize(11); doc.text(`Guru Wali: ${currentGuru.nama}`, 14, 30);
            doc.text(`Periode: ${exportStartDate} s/d ${exportEndDate}`, 14, 36);
            const tableColumn = ["Tgl", "Nama Siswa", "NISN", "Kelas", "Status"];
            const tableRows = [];
            data.forEach(item => {
                tableRows.push([item.tanggal, item.nama, item.nisn, item.kelas, item.status]);
            });
            doc.autoTable({
                startY: 45, head: [tableColumn], body: tableRows, theme: 'grid', styles: { fontSize: 9, cellPadding: 2 },
                headStyles: { fillColor: [41, 128, 185], textColor: 255 },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 4) {
                        const status = data.cell.raw;
                        if (status === 'ALPA') data.cell.styles.textColor = [220, 38, 38];
                        if (status === 'IZIN') data.cell.styles.textColor = [202, 138, 4];
                        if (status === 'SAKIT') data.cell.styles.textColor = [37, 99, 235];
                        if (status === 'HADIR') data.cell.styles.textColor = [22, 163, 74];
                    }
                }
            });
            doc.save(`Laporan_${currentGuru.nama}_${exportStartDate}_sd_${exportEndDate}.pdf`);
            showToast("PDF berhasil diunduh!", "success");
        } catch (error) {
            console.error(error);
            showToast("Gagal export PDF: " + error.message, "error");
        } finally {
            if(btn) { btn.disabled = false; btn.innerHTML = originalContent; }
        }
    }

              </h3>
              <label class="text-xs text-slate-500 mb-1 block">Pilih Tanggal</label>
              <input type="date" id="inputTanggal" value="${tanggalDipilih}" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none mb-4">
              <div id="dateAlertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium border alert-enter"></div>
              <div class="flex flex-col gap-3">
                <button id="btnSimpan" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-600">
                  <i class="ph ph-floppy-disk"></i> <span id="btnSimpanText">Simpan Kehadiran</span>
                </button>
                <button id="btnHapus" class="hidden w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-medium transition flex items-center justify-center gap-2 shadow-lg border border-red-500/50 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-slate-600">
                  <i class="ph ph-trash"></i> Hapus Data
                </button>
              </div>
            </section>

            <!-- KOLOM KANAN -->
            <div class="md:col-span-2 space-y-6">
                <section class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg">
                   <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Statistik Kelas Binaan</h3>
                   <div class="grid grid-cols-2 gap-4 text-center">
                      <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                        <span class="block text-2xl font-bold text-white" id="totalSiswa">-</span>
                        <span class="text-xs text-slate-500">Total Siswa</span>
                      </div>
                      <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                        <span class="block text-2xl font-bold text-green-400" id="statHadir">-</span>
                        <span class="text-xs text-slate-500">Hadir Hari Ini</span>
                      </div>
                   </div>
                </section>
            </div>
          </div>

          <!-- List Siswa -->
          <section class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden mt-6">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800 sticky top-0 z-10">
              <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="ph ph-users-three text-yellow-400"></i> Daftar Siswa Binaan
              </h3>
            </div>
            <div id="siswaListContainer" class="p-0">
              <div class="p-8 text-center text-slate-500"><div class="loader mx-auto mb-2"></div>Memuat data siswa...</div>
            </div>
          </section>

          <!-- Tab Export -->
          <section class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg mt-6">
              <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                  <i class="ph ph-file-text text-purple-400"></i> Laporan & Export Data
              </h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                  <div>
                      <label class="text-xs text-slate-500 block mb-1">Dari Tanggal</label>
                      <input type="date" id="exportStartDate" value="${exportStartDate}" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-2 text-sm">
                  </div>
                  <div>
                      <label class="text-xs text-slate-500 block mb-1">Sampai Tanggal</label>
                      <input type="date" id="exportEndDate" value="${exportEndDate}" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg p-2 text-sm">
                  </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                  <button id="btnExportXls" class="bg-green-700 hover:bg-green-800 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 transition disabled:opacity-50">
                      <i class="ph ph-file-xls text-lg"></i> Download Excel
                  </button>
                  <button id="btnExportPdf" class="bg-rose-700 hover:bg-rose-800 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 transition disabled:opacity-50">
                      <i class="ph ph-file-pdf text-lg"></i> Download PDF
                  </button>
              </div>
          </section>
        </div>
      `;

      document.getElementById('btnLogout').addEventListener('click', logout);
      document.getElementById('btnSimpan').addEventListener('click', simpanKehadiran);
      document.getElementById('btnHapus').addEventListener('click', hapusKehadiran);
      document.getElementById('btnExportXls').addEventListener('click', exportToExcel);
      document.getElementById('btnExportPdf').addEventListener('click', exportToPDF);
      document.getElementById('exportStartDate').addEventListener('change', (e) => exportStartDate = e.target.value);
      document.getElementById('exportEndDate').addEventListener('change', (e) => exportEndDate = e.target.value);
      
      const btnNotif = document.getElementById('btnNotif');
      if (btnNotif) {
        if (Notification.permission === 'granted') updateBellIcon();
        btnNotif.addEventListener('click', requestNotificationPermission);
      }

      document.getElementById('inputTanggal').addEventListener('change', (e) => {
        tanggalDipilih = e.target.value;
        loadSiswaList();
      });

      await loadSiswaList();
      setTimeout(checkDailyReminder, 2000);
    }

    async function loadSiswaList() {
      // VALIDASI TANGGAL ASYNC
      dateValidationState = await validateDateAsync(tanggalDipilih);
      const isLocked = !dateValidationState.isValid;
      
      const alertBox = document.getElementById('dateAlertBox');
      const btnSimpan = document.getElementById('btnSimpan');
      const btnHapus = document.getElementById('btnHapus');

      if (alertBox) {
        if (isLocked) {
          alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium border bg-amber-900/30 border-amber-600/50 text-amber-200 block alert-enter";
          alertBox.innerText = dateValidationState.message;
        } else {
          alertBox.className = "hidden";
          alertBox.innerText = "";
        }
      }

      if (btnSimpan) btnSimpan.disabled = isLocked;
      if (btnHapus) btnHapus.disabled = isLocked;

      const container = document.getElementById('siswaListContainer');
      const btnText = document.getElementById('btnSimpanText');
      
      if (!container.innerHTML.includes("divide-y") && !container.innerHTML.includes("table")) {
         container.innerHTML = `<div class="p-8 text-center text-slate-500"><div class="loader mx-auto mb-2"></div>Memuat data siswa...</div>`;
      }
      
      siswaBinaan = await fetchSiswaBinaan();
      document.getElementById('totalSiswa').innerText = siswaBinaan.length;
      
      if (siswaBinaan.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500"><i class="ph ph-empty text-4xl mb-2"></i><p>Tidak ada siswa binaan ditemukan.</p></div>`;
        document.getElementById('statHadir').innerText = "-";
        return;
      }

      let kehadiranMap = {};
      let hadirCount = 0;
      isEditMode = false;

      if (!isDemoMode) {
        const siswaIds = siswaBinaan.map(s => s.id);
        const { data: kehadiranList, error } = await supabase
          .from('kehadiran')
          .select('id_siswa, status')
          .eq('tanggal', tanggalDipilih)
          .in('id_siswa', siswaIds);

        if (kehadiranList && kehadiranList.length > 0) {
          isEditMode = true;
          kehadiranList.forEach(k => {
             kehadiranMap[k.id_siswa] = k.status;
             if(k.status === 'HADIR') hadirCount++;
          });
        }
      } else {
        isEditMode = Math.random() > 0.5;
      }

      if (btnText && btnSimpan && btnHapus) {
        if (isLocked) {
             btnText.innerText = "Input Dikunci";
             btnSimpan.classList.add('bg-slate-600'); 
             btnSimpan.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'bg-blue-600', 'hover:bg-blue-700');
             btnHapus.classList.add('hidden');
        } else {
            btnText.innerText = isEditMode ? "Update Kehadiran" : "Simpan Kehadiran";
            if(isEditMode) {
              btnSimpan.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'bg-slate-600');
              btnSimpan.classList.add('bg-blue-600', 'hover:bg-blue-700');
              btnHapus.classList.remove('hidden');
            } else {
              btnSimpan.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'bg-slate-600');
              btnSimpan.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
              btnHapus.classList.add('hidden');
            }
        }
      }

      document.getElementById('statHadir').innerText = isEditMode ? hadirCount : 0;

      let html = '<div class="divide-y divide-slate-700">';
      const statusOptions = [{ val: 'HADIR', label: '🟢 Hadir' }, { val: 'IZIN', label: '🟡 Izin' }, { val: 'ALPA', label: '🔴 Alpa' }, { val: 'SAKIT', label: '🔵 Sakit' }];

      for (const s of siswaBinaan) {
        const savedStatus = kehadiranMap[s.id]; 
        const currentStatus = savedStatus || 'HADIR'; 
        
        const selectClass = savedStatus ? "border-blue-500 bg-blue-900/20 ring-1 ring-blue-500/50 text-blue-100 font-medium" : "bg-slate-900 border-slate-600 text-slate-300";
        const disabledAttr = isLocked ? 'disabled' : '';
        const cursorClass = isLocked ? 'disabled-input' : 'cursor-pointer';
        
        const optionsHtml = statusOptions.map(opt => {
            const isSelected = currentStatus === opt.val;
            const labelText = (savedStatus === opt.val) ? `${opt.label} ✓` : opt.label;
            return `<option value="${opt.val}" ${isSelected ? 'selected' : ''}>${labelText}</option>`;
        }).join('');

        html += `
          <div class="p-4 hover:bg-slate-750 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4 group hover:bg-slate-700/30">
            <div class="flex items-center gap-4">
              <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 font-bold">
                ${s.nama.charAt(0)}
              </div>
              <div>
                <p class="font-medium text-white">${s.nama}</p>
                <p class="text-sm text-slate-400 font-mono">${s.nisn || '-'}</p>
              </div>
            </div>
            <div class="w-full sm:w-48 relative">
              <select id="status-${s.id}" ${disabledAttr} class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all ${selectClass} ${cursorClass}">${optionsHtml}</select>
              ${savedStatus ? '<div class="absolute right-8 top-1/2 -translate-y-1/2 text-blue-400 pointer-events-none text-xs font-bold bg-slate-800 px-1 rounded">Tersimpan</div>' : ''}
            </div>
          </div>
        `;
      }
      html += '</div>';
      container.innerHTML = html;
    }

    // --- LOGIC ---
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<div class="loader border-white border-t-transparent w-5 h-5"></div>`;
      btn.disabled = true;
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === 'demo' && password === 'demo') {
        setTimeout(() => {
          const guru = { id: 'demo-001', nama: 'Guru Demo', username: 'demo' };
          saveSession(guru, true);
          currentGuru = guru;
          isDemoMode = true;
          showToast(`Login Demo Berhasil!`);
          renderDashboard();
        }, 800);
        return;
      }

      try {
        const { data, error } = await supabase.from("guru").select("*").eq("username", username).eq("password", password).maybeSingle();
        if (error) throw error;
        if (!data) throw new Error("User tidak ditemukan");
        
        saveSession(data, false);
        currentGuru = data;
        isDemoMode = false;
        
        showToast(`Selamat datang, ${data.nama}!`);
        renderDashboard();
      } catch (err) {
        console.error(err);
        showToast("Login gagal: " + err.message, "error");
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function fetchSiswaBinaan() {
      if (isDemoMode) {
        return [{ id: 1, nama: 'Andi Saputra', nisn: '1234567890' }, { id: 2, nama: 'Budi Santoso', nisn: '0987654321' }, { id: 3, nama: 'Citra Kirana', nisn: '1122334455' }];
      }
      const { data, error } = await supabase.from("bimbingan").select("siswa(*)").eq("id_guru", currentGuru.id);
      if (error) { console.error("Error fetch siswa:", error); return []; }
      return data.map(item => item.siswa).filter(Boolean);
    }

    async function simpanKehadiran() {
      if (!dateValidationState.isValid) { showToast(dateValidationState.message, "error"); return; }
      if(isDemoMode) { showToast(isEditMode ? "Update Berhasil (Demo)" : "Simpan Berhasil (Demo)"); return; }

      const btn = document.getElementById('btnSimpan');
      const originalText = btn.innerHTML;
      btn.innerText = "Memproses...";
      btn.disabled = true;

      try {
        // --- UPDATE LOGIC: UPSERT (Simpan Bersamaan) ---
        const payload = siswaBinaan.map(s => ({
            id_siswa: s.id,
            id_guru: currentGuru.id,
            tanggal: tanggalDipilih,
            status: document.getElementById(`status-${s.id}`).value
        }));

        const { error } = await supabase
            .from('kehadiran')
            .upsert(payload, { onConflict: 'id_siswa,tanggal' });

        if (error) throw error;

        sendLocalNotification(
            "Kehadiran Disimpan", 
            `Guru ${currentGuru.nama} telah menyimpan kehadiran untuk tanggal ${tanggalDipilih}.`
        );

        if (isEditMode) {
          showToast("Data kehadiran berhasil diperbarui", "success");
        } else {
          showToast("Data kehadiran berhasil disimpan", "success");
        }
        await loadSiswaList(); // Refresh UI State
      } catch (err) {
        console.error(err);
        showToast("❌ Gagal menyimpan: " + err.message, "error");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function hapusKehadiran() {
      if (!dateValidationState.isValid) { showToast(dateValidationState.message, "error"); return; }
      if (!confirm("⚠️ Apakah Anda yakin ingin MENGHAPUS seluruh data kehadiran pada tanggal ini?")) return;
      if (isDemoMode) { showToast("Data dihapus (Demo)"); isEditMode = false; loadSiswaList(); return; }

      const btn = document.getElementById('btnHapus');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<div class="loader w-4 h-4 mx-auto"></div>';
      btn.disabled = true;

      try {
        // --- UPDATE LOGIC: DELETE BY SISWA (Bukan Guru) ---
        const siswaIds = siswaBinaan.map(s => s.id);
        const { error } = await supabase
            .from('kehadiran')
            .delete()
            .in('id_siswa', siswaIds)
            .eq('tanggal', tanggalDipilih);

        if (error) throw error;
        showToast("✅ Data kehadiran berhasil dihapus");
        isEditMode = false;
        btn.classList.add('hidden');
        const btnSimpan = document.getElementById('btnSimpan');
        const btnText = document.getElementById('btnSimpanText');
        if (btnSimpan && btnText) {
          btnText.innerText = "Simpan Kehadiran";
          btnSimpan.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btnSimpan.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
        }
        siswaBinaan.forEach(s => { const select = document.getElementById(`status-${s.id}`); if (select) select.value = 'HADIR'; });
        await loadSiswaList();
      } catch (err) {
        console.error("Error Hapus:", err);
        showToast("Gagal menghapus data: " + err.message, "error");
        btn.innerHTML = originalText;
        btn.classList.remove('hidden'); 
        btn.disabled = false;
      }
    }

    function logout() {
      clearSession();
      renderLogin();
    }

    checkSession();
  </script>
</body>
</html>
